name: "Release"

# main へのプルリクがマージされたら自動で実行する。
#   1. プルリクのラベル（major / minor / patch）から版の上げ方を決める（判定は package.py --bump-from-labels）。
#      ラベルが無い・複数ある・読めないときは、版を決めずに理由を出して止める（何も push しない）。
#   2. package.json の version の 1 行だけを上げる（package.py --bump）。
#   3. .github/scripts/package.py で VCC（VPM）用の zip を作る。作れなければここで止まる。
#   4. 版を上げたコミットを main へ push する。
#   5. 公開の Release（タグ付き）を作り、zip だけを付ける。付いた zip が作ったものと同じか確かめる。
#   6. VCC の一覧（vpmrepo-list）の作り直しを起こす。
#
# 手動実行（workflow_dispatch）もできる。その場合は bump の入力で上げ方を指定する（main でだけ実行できる）。
#
# 外のコンテナ・外の action は使わない。使うのは GitHub 自身の actions/checkout だけで、
# コミットの SHA で固定している。書き込める鍵（GITHUB_TOKEN）は checkout に残さず、
# push と Release を作る段にだけ渡す。ほかの段はその鍵を持たない。
#
# Release を作る GITHUB_TOKEN の操作では `release` イベントが発火しない（GitHub の再帰防止の仕様）ので、
# 一覧の作り直しは 6. で repository_dispatch を直接送る（notify-vpm-listing.yml は手作業の Release 用）。
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

defaults:
  run:
    shell: bash

env:
  TARGET_BRANCH: main

jobs:
  release:
    # マージされた PR か、手動実行のときだけ走らせる（クローズのみの PR は無視）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    # 同時に 2 つ走ると版の push が競合するので、同時には走らせない（走っている間は待つ）。
    # 保証の射程: GitHub は同じ group に「走っている 1 つ」と「待っている 1 つ」しか持たない。走っている間に
    # 2 つ以上マージされると、待ちのうち古い方は取り消される（cancel-in-progress: false が止めないのは走っている実行だけ）。
    # 取り消された PR は版もラベルも使われないが、内容は main に入っているので、次の実行が main の最新から上げる版に含まれる。
    # その PR のラベルどおりに上げたいときは workflow_dispatch で bump を指定する。
    # 待ちを取り消さず順に走らせるには concurrency に `queue: max`（最大 100。GitHub が 2026-05 に足した）を足せる。
    # actionlint 1.7.12 がまだ知らない鍵で、GitHub 上でしか確かめられないので、今は使っていない。
    # マージされずに閉じた PR の実行は job の if で飛ばされるが、念のため、飛ばされる実行は別の group にして
    # 待っている本物のリリースを押し出さないようにする（式は上の if と同じ条件）。
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && 'release' || format('release-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: "Check branch (manual run)"
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != env.TARGET_BRANCH }}
        run: |
          echo "::error title=main 以外では実行できません::手動実行は ${TARGET_BRANCH} を選んでください（今は ${GITHUB_REF_NAME}）。"
          exit 1

      - name: "Checkout main"
        # actions/checkout v7.0.1（MIT）。タグではなくコミットの SHA で固定する。
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # 書き込める鍵を .git/config に残さない（push の段で明示的に渡す）
          persist-credentials: false

      - name: "Test packaging script"
        run: python3 .github/scripts/test_package.py

      - name: "Determine version bump"
        id: "bump"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 手動実行は入力の上げ方（choice）をそのまま使う。マージの実行はラベルから package.py が決める
          # （無い・複数・読めないときは 1 つに決めずに止める。判定は test_package.py で試験している）。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            type="$INPUT_BUMP"
          else
            err="$RUNNER_TEMP/bump-error.txt"
            if ! type="$(python3 .github/scripts/package.py --bump-from-labels "$LABELS" --pr "$PR_NUMBER" 2>"$err")"; then
              echo "::error title=版の上げ方を決められません::$(sed 's/^エラー: //' "$err")"
              exit 1
            fi
          fi
          echo "Selected bump type: $type"
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: "Bump package.json version"
        id: "version"
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          new_version="$(python3 .github/scripts/package.py --bump "$BUMP_TYPE")"
          echo "Bumped to $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: "Build zip"
        id: "build"
        run: python3 .github/scripts/package.py --out "$RUNNER_TEMP/dist" --github-output

      - name: "Commit version bump to main"
        id: "commit"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          changed="$(git status --porcelain)"
          if [ "$changed" != " M package.json" ]; then
            echo "::error title=想定外の変更があります::package.json 以外が変わっています。止めます。"
            echo "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${RELEASE_VERSION} [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Create Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          ZIP_PATH: ${{ steps.build.outputs.zip-path }}
        run: |
          # Release に付けるのは zip だけ（VCC の一覧は Release の .zip を全部読むので、ほかの .zip は付けない）
          gh release create "$RELEASE_VERSION" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes

      - name: "Verify the published zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ZIP_PATH: ${{ steps.build.outputs.zip-path }}
          ZIP_SHA256: ${{ steps.build.outputs.zip-sha256 }}
        run: |
          # 一覧は配られた zip のバイト列から SHA-256 を計算する。付いた物が作った物と同じか確かめる。
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$dir"
          name="$(basename "$ZIP_PATH")"
          published="$(sha256sum "$dir/$name" | cut -d' ' -f1)"
          if [ "$published" != "$ZIP_SHA256" ]; then
            echo "::error title=公開した zip が作った zip と違います::作った ${ZIP_SHA256} / 公開 ${published}"
            exit 1
          fi
          {
            echo "### Release ${RELEASE_VERSION}"
            echo ""
            echo "- ${name}"
            echo "- SHA-256: \`${ZIP_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Trigger VPM listing rebuild"
        env:
          DISPATCH_TOKEN: ${{ secrets.LISTING_DISPATCH_TOKEN }}
          LISTING_REPO: "YozoraKurage/vpmrepo-list"
          DISPATCH_EVENT_TYPE: "vpm-package-release"
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::LISTING_DISPATCH_TOKEN secret is not set; skipping VPM listing rebuild trigger."
            exit 0
          fi
          payload="$(jq -nc \
            --arg event "$DISPATCH_EVENT_TYPE" \
            --arg repo "$SOURCE_REPO" \
            --arg version "$RELEASE_VERSION" \
            '{event_type: $event, client_payload: {repository: $repo, version: $version}}')"
          curl --fail -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${LISTING_REPO}/dispatches" \
            -d "$payload"
